services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Woit\SiNsContentElements\:
    resource: '../Classes/*'

  Woit\SiNsContentElements\EventListener\AddPageModuleButton:
    tags:
      - name: event.listener
        identifier: 'woit/si-ns-content-elements/page-module-button'

  Woit\SiNsContentElements\EventListener\AddBackToNewsButton:
    tags:
      - name: event.listener
        identifier: 'woit/si-ns-content-elements/back-to-news-button'

  Woit\SiNsContentElements\EventListener\AddNewsModeHeader:
    tags:
      - name: event.listener
        identifier: 'woit/si-ns-content-elements/news-mode-header'

  Woit\SiNsContentElements\EventListener\RelateNewContentToNews:
    tags:
      - name: event.listener
        identifier: 'woit/si-ns-content-elements/relate-new-content'

  # Replaces the page module filter of EXT:news (which hides all news content elements in news folders).
  # Outside the news mode the original listener is called unchanged.
  Woit\SiNsContentElements\EventListener\FilterPageModuleContent:
    decorates: GeorgRinger\News\Event\Listener\ModifyDatabaseQueryForContentEventListener
    arguments:
      $inner: '@.inner'

  # Called via GeneralUtility::callUserFunction() (TCA customControls)
  Woit\SiNsContentElements\Form\PageModuleControl:
    public: true

  # Instantiated by FormEngine via GeneralUtility::makeInstance()
  Woit\SiNsContentElements\Form\FormDataProvider\NewsContentColPos:
    public: true
